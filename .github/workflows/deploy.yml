name: Deploy to AWS EKS

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

env:
    AWS_REGION: us-west-2
    EKS_CLUSTER_NAME: helix-cluster

jobs:
    build-and-push:
        name: Build and Push Docker Images
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set image tag
              id: image-tag
              run: |
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  else
                    echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
                  fi

            - name: Build and push backend image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
              run: |
                  cd backend
                  docker build -t $ECR_REGISTRY/helix-backend:$IMAGE_TAG .
                  docker push $ECR_REGISTRY/helix-backend:$IMAGE_TAG
                  docker tag $ECR_REGISTRY/helix-backend:$IMAGE_TAG $ECR_REGISTRY/helix-backend:latest
                  docker push $ECR_REGISTRY/helix-backend:latest

            - name: Build and push code executor image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
              run: |
                  cd backend/docker/code-executor
                  docker build -t $ECR_REGISTRY/helix-code-executor:$IMAGE_TAG .
                  docker push $ECR_REGISTRY/helix-code-executor:$IMAGE_TAG
                  docker tag $ECR_REGISTRY/helix-code-executor:$IMAGE_TAG $ECR_REGISTRY/helix-code-executor:latest
                  docker push $ECR_REGISTRY/helix-code-executor:latest

            - name: Build and push sandbox worker image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
              run: |
                  cd backend/sandbox_worker
                  docker build -t $ECR_REGISTRY/helix-sandbox-worker:$IMAGE_TAG .
                  docker push $ECR_REGISTRY/helix-sandbox-worker:$IMAGE_TAG
                  docker tag $ECR_REGISTRY/helix-sandbox-worker:$IMAGE_TAG $ECR_REGISTRY/helix-sandbox-worker:latest
                  docker push $ECR_REGISTRY/helix-sandbox-worker:latest

    deploy:
        name: Deploy to EKS
        needs: build-and-push
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Update kubeconfig
              run: |
                  aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

            - name: Set image tag
              id: image-tag
              run: |
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  else
                    echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
                  fi

            - name: Update deployment with new image
              env:
                  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
                  IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
              run: |
                  kubectl set image deployment/helix-backend \
                    helix-backend=$ECR_REGISTRY/helix-backend:$IMAGE_TAG
                  kubectl set image deployment/helix-code-executor \
                    code-executor=$ECR_REGISTRY/helix-code-executor:$IMAGE_TAG
                  kubectl set image deployment/helix-sandbox-worker \
                    sandbox-worker=$ECR_REGISTRY/helix-sandbox-worker:$IMAGE_TAG

            - name: Wait for rollout
              run: |
                  kubectl rollout status deployment/helix-backend --timeout=5m
                  kubectl rollout status deployment/helix-code-executor --timeout=5m
                  kubectl rollout status deployment/helix-sandbox-worker --timeout=5m

            - name: Verify deployment
              run: |
                  kubectl get pods
                  kubectl get services

            - name: Test health endpoint
              run: |
                  BACKEND_URL=$(kubectl get service helix-backend-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
                  echo "Backend URL: http://${BACKEND_URL}"
                  sleep 30  # Wait for LB to be ready
                  curl -f http://${BACKEND_URL}/health || exit 1
